[project]
name = "ecmc-ioc-generator"
# version = "1.0.0"
description = "EtherCAT bus scanner and ecmc IOC generator."
authors = [
  { name = "Markus Kristensson", email = "markus.kristensson@ess.eu" },
]
dynamic = ["version"]
requires-python = ">=3.12, <3.15"
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[dependency-groups]
dev = [
  "ruff",
  "pyright[nodejs] !=1.1.401, !=1.1.407",
  "prek",
  "pytest>=6",
  "pytest-cov>=3",
  "pytest-asyncio",
  "pytest-md",
  "typing-extensions",
]

dependencies = []

[project.scripts]
ecmc-ioc-gen = "ecmc_ioc_generator.cli:cli"

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["*.py", "*.pyi", "**/pyproject.toml"]

lint.select = [
  "ALL",
]
lint.ignore = [
  "ANN",    # ignore type annotations (not for py27)
  "COM812",
  "D107",   # docstrings for __init__ methods
  "D203",   # incompatibility between ruff lint and ruff format
  "D211",   # incompatibility with D203
  "D212",   # incompatibility with D213
  "FBT002", # ignore boolean trap in constructor
  "FIX",    # FIXMEs
  "INP001", # allow namespace package
  "ISC001", # may cause conflicts when used with the formatter
  "N802",
  "N803",
  "N806",   # allow uppercase variable
  "N815",   # allow camelCase function name, function argument, class scope
  "PTH",    # ignore pathlib suggestions (not for py27)
  "S607",   # ignore partial executable paths
  "T201",   # allow print
  "TD",     # TODOs
  "UP",     # ignore pyupgrade (protect 2.7 compatibility)
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch]
version.source = "vcs"
build.hooks.vcs.version-file = "src/ecmc_ioc_generator/_version.py"
version.fallback-version = "0.0.0"

# [tool.hatch.build.targets.wheel]
# packages = ["src/ecmc_ioc_generator"]

[tool.hatch.envs.default]
features = ["dev"]
scripts.test = "pytest {args}"
